plugins { id 'com.android.application' }

android {
    namespace 'br.com.redemarajo.widget'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.redemarajo.widget'
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.10.1'
}
